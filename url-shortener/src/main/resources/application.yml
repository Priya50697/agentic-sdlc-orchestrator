spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:h2:file:./data/urlshortener
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  error:
    include-stacktrace: never

ratelimit:
  max-requests: 60
  window-seconds: 60

external-check:
  timeout-ms: 3000
  max-retries: 2
  backoff-ms: 200
  mode: stub
